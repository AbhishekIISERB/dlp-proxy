[package]
name = "dlp-proxy"
version = "0.1.0"
edition = "2024"

[dependencies]
hudsucker = { git = "https://github.com/omjadas/hudsucker", features = ["decoder", "rcgen-ca", "rustls-client"] }
tokio = { version = "1.24", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
regex = "1.10"
tracing = "0.1"
tracing-subscriber = "0.3"
http-body-util = "0.1"
rcgen = { version = "0.14", features = ["x509-parser"] }

[dev-dependencies]
reqwest = { version = "0.12", features = ["rustls-tls"] }
flate2 = "1.0"

[[example]]
name = "evaluate"
path = "bench/evaluate.rs"

[[example]]
name = "benchmark"
path = "bench/benchmark.rs"

[[example]]
name = "profile_redact"
path = "bench/profile_redact.rs"

[[example]]
name = "stream_bench"
path = "bench/stream_bench.rs"

[profile.release]
debug = true
